# jetbot_lane_safety.yaml -- DAM safety config for Jetbot boundary demo.
#
# Action vector: [x_target, y_target] in world meters.
# The safe region deliberately excludes the left/right side bands and the bottom
# band drawn in red in scripts/09_dam_car_scripted_comparison_demo.py.

version: "1"

safety:
  control_frequency_hz: 120
  enforcement_mode: enforce
  no_task_behavior: hold_position

fallbacks:
  hold_position:
    type: hold_position
    severity: 80
  clamp_to_region:
    type: slow_down
    severity: 40
    requires_proposal: true
    params:
      scale: 1.0

guards:
  - L1: boundary
    phase: 0
    timeout_ms: 10

boundaries:
  arena_position_limits:
    layer: L1
    type: single
    nodes:
      - callback: joint_position_limits
        fallback: clamp_to_region
        params:
          # x lower bound keeps the target away from the bottom red band.
          # y bounds keep the target away from the left/right red bands.
          lower: [-0.28, -0.24]
          upper: [1.20, 0.24]

tasks:
  default:
    description: "Jetbot 2D target stays inside the green safe region"
    boundaries:
      - arena_position_limits
