# jetbot_lane_safety.yaml -- DAM safety config for the Jetbot boundary demo.
#
# Observation vector (5D):
#   [x, y, yaw, v, omega]
#   - pose group  [0:3]: x, y, yaw  — current planar pose in local frame
#   - command group [3:5]: v, omega  — current velocity (0 in obs)
#
# Action vector (5D):
#   [x, y, yaw, v_cmd, omega_cmd]
#   - pose group  [0:3]: echoed from obs (not commanded)
#   - command group [3:5]: v_cmd, omega_cmd — requested velocity
#
# The L1 rollout boundary uses pose [x,y,yaw] from obs + command [v,omega]
# from action to predict the next state and check it stays in the safe region.
# On REJECT the fallback returns obs = [x,y,yaw,0,0], so the command
# naturally becomes [0,0] (hold position / stop).

version: "1"

hardware:
  preset: jetbot_diff_drive
  joint_names: [x, y, yaw, v, omega]
  degrees_mode: false
  action_layout:
    - name: pose
      keys: [x, y, yaw]
    - name: command
      keys: [v, omega]

safety:
  control_hz: 120
  enforcement_mode: enforce
  no_task_behavior: hold_position

fallbacks:
  hold_position:
    severity: 80
  slow_down:
    severity: 40
    requires_proposal: true
    params:
      scale: 0.35

guards:
  - L1: boundary
    phase: 0
    timeout_ms: 10

boundaries:
  rollout_inside_safe_region:
    layer: L1
    type: single
    nodes:
      - callback: jetbot_rollout_inside_safe_region
        params:
          x_min: -0.35
          x_max: 1.40
          y_abs_max: 0.48
          dt: 0.12

tasks:
  default:
    description: "Jetbot diff-drive command keeps rollout inside the green safe region"
    boundaries:
      - rollout_inside_safe_region
