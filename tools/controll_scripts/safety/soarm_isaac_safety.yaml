# soarm_isaac_safety.yaml — DAM safety config for SO-ARM101 in Isaac Sim.
#
# All values in radians (degrees_mode: false in Isaac Sim).
# Joint limits match the USD articulation properties.
#
# Usage:
#   python scripts/11_dam_safety_demo.py
#   python scripts/12_dam_teleoperate_demo.py

version: "1"

hardware:
  preset: so101_follower

safety:
  control_frequency_hz: 120    # Isaac Sim default physics rate
  enforcement_mode: enforce
  no_task_behavior: hold_position

fallbacks:
  hold_position:
    type: hold_position
    severity: 80
  slow_down:
    type: slow_down
    severity: 40
    requires_proposal: true
    params:
      scale: 0.5

guards:
  - L1: motion
    phase: 0
    timeout_ms: 5

boundaries:
  # Joint position limits (radians) — from SO-ARM101 USD / URDF
  joint_position_limits:
    layer: L1
    type: single
    nodes:
      - callback: joint_position_limits
        params:
          # [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
          upper: [1.8243, 1.6, 1.5, 1.5, 3.0741, 1.7453]
          lower: [-1.8243, -1.6, -1.6, -1.5, -3.0741, 0.0]

  # Joint velocity limit (rad/s) — conservative for sim safety
  joint_velocity_limit:
    layer: L1
    type: single
    nodes:
      - callback: joint_velocity_limit
        params:
          max_velocities: [4.0, 4.0, 4.0, 4.0, 4.0, 4.0]

  # Joint acceleration limit (rad/s²) — smoothing
  joint_acceleration_limit:
    layer: L1
    type: single
    nodes:
      - callback: joint_acceleration_limit
        params:
          max_acceleration: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0]

tasks:
  default:
    description: "Isaac Sim guarded control — position, velocity, acceleration limits"
    boundaries:
      - joint_position_limits
      - joint_velocity_limit
      - joint_acceleration_limit
