[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_robot_training"
version = "0.1.0"
description = "Robot Control Library for Isaac Lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [
    "tools",
    "projects/rl_direct/source/rl_direct",
    "projects/rl_manager/source/rl_manager",
    "projects",
]
include = [
    "controll_scripts*",
    "rl_direct*",
    "rl_manager*",
    "so_arm_mimic*",
]
namespaces = false

[tool.setuptools.package-data]
controll_scripts = [
    "so_arm_101/*.usd",
    "so_arm_101/*.yaml",
    "so_arm_101/**/*.urdf",
    "so_arm_101/**/*",
]
"controll_scripts.safety" = [
    "*.yaml",
]
